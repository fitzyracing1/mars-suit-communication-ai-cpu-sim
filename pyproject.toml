[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-cpu"
version = "0.1.0"
description = "Minimal CPU-style simulator that calls one number over Wi-Fi"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Joshua Fitzgerald" }
]

[project.scripts]
wifi-cpu = "wifi_cpu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
